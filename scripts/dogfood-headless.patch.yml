# Headless Stage-2 dogfood overlay (compaction-engine.md §4.2 live check).
# Boot: dsh --profile headless --patch <this file> -- <task>
#
# What it does to the headless composition:
#   1. Disables compaction-basic entirely: cordis service registration is
#      EXCLUSIVE (verified live: with basic merely auto:false, the CLM
#      engine's ctx.set('compaction') threw "service has been registered"
#      and the entry did not activate). Patch rows cannot rename an entry
#      and plain inserts append at the end, so the engine goes in last.
#      Side effect: command-compact (the only 'compaction' inject,
#      consumed lazily per /compact invoke but checked at mount) does not
#      activate in this throwaway profile — irrelevant for the dogfood,
#      which exercises the automatic pressure path. In production the
#      preset mounts the engine INSIDE the compaction group before
#      command-compact, so this ordering dance is headless-only.
#   2. Appends @local/dsh-clm-compaction with a tiny thresholdRatio so the
#      three-phase loop fires after ~21K tokens instead of ~160K (the
#      protocol is size-independent; this keeps the dogfood cheap). Its
#      constructor registers the pre-step/request-error listeners (auto
#      defaults to true) and the compaction service.
#   3. Appends the dsh-clm host plugin (context_edit with the `compaction`
#      checkpoint parameter).
#   4. Routes the run at kimi-coding/k3-256k; the API key resolves from
#      KIMI_CODING_API_KEY in the LAUNCHING environment OR from the
#      credentials store (a key saved via the web Models page works too —
#      verified: the mount smoke test completed a full LLM round-trip
#      without the env var).
#
# Requires: @local/{dsh-clm,dsh-clm-compaction} symlinks under
# ~/.dsh/profiles/headless/node_modules/@local/ (scripts/dogfood-headless.sh
# creates them).

- id: compaction-basic
  disabled: true

# The pruners middle-truncate large tool results (~13K tokens each), which
# kept the surface UNDER the dogfood threshold on the first run (only
# compaction/prune events fired — no transaction). The CLM preset disables
# them for the same reason (they also mangle context_edit map dumps).
- id: tool-result-pruner
  disabled: true
- id: image-offload
  disabled: true

- insert:
    - id: clm-compaction
      name: '@local/dsh-clm-compaction'
      config:
        # Dogfood tuning: fire the loop early. Everything else stays default
        # so the observed behavior matches production (auto, fallback basic).
        thresholdRatio: 0.08 # ~21K of 262144
        retainRatio: 0.02
        maxWaitSteps: 10
        overflowMaxWaitSteps: 2
    - id: dsh-clm
      name: '@local/dsh-clm'
      config: {}

- id: llm-pi-ai
  name: '@deepseek-ai/dsh-llm-pi-ai'
  config:
    providers:
      kimi-coding:
        apiKeyEnv: KIMI_CODING_API_KEY
        models:
          - id: k3-256k
            name: Kimi K3-256K
            contextWindow: 262144
            maxTokens: 32768

- id: agent-default-model
  name: '@deepseek-ai/dsh-agent-default-model'
  config:
    provider: kimi-coding
    model: k3-256k
